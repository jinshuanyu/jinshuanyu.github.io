    { ic:"🍵", t:"Steep 專注計時", d:"25 分鐘專注＋5 分鐘休息的番茄鐘計時器，切換工作與休息模式，讓大腦有節奏地深度工作。", url:"https://jinshuanyu.github.io/steep/", img:"steep" },
    { ic:"🥚", t:"蛋白質夠了嗎？", d:"輸入家人的體重與活動量，計算每日蛋白質目標，點選食物建立今日餐盤，還能生成家庭採買清單。", url:"https://jinshuanyu.github.io/protein-tracker/", img:"protein-tracker" }
  ]}
];

const $ = id => document.getElementById(id);
function esc(s){ const d=document.createElement("div"); d.textContent=s; return d.innerHTML; }
const style = c => `--a:${c.a};--b:${c.b}`;

/* 首頁大方塊 */
$("tiles").innerHTML = CATS.map(c => `
  <button class="tile" type="button" data-id="${c.id}" style="${style(c)}">
    <span class="e">${c.e}</span>
    <span class="n">${esc(c.name)}</span>
    <span class="c">${c.items.length} 個工具</span>
  </button>`).join("");
$("tiles").addEventListener("click", e => {
  const t = e.target.closest(".tile"); if (t) location.hash = t.dataset.id;
});

/* 分類頁 */
function renderCat(c){
  $("crumb").innerHTML = `<span class="e" style="${style(c)}">${c.e}</span>${esc(c.name)}<small>${c.items.length} 個工具</small>`;
  $("cards").innerHTML = c.items.map(it => `
    <a class="card" href="${it.url}" style="${style(c)}">
      <span class="shot"><img loading="lazy" src="img/${it.img}.jpg" alt="${esc(it.t)} 畫面" width="800" height="500"><span class="ic">${it.ic}</span></span>
      <span class="body">
        <span class="t">${esc(it.t)}${it.en ? `<small>${esc(it.en)}</small>` : ""}</span>
        <span class="d">${esc(it.d)}</span>
        ${it.alt ? `<span class="alt" data-url="${it.alt.url}">${esc(it.alt.t)} ↗</span>` : ""}
      </span>
    </a>`).join("");
  $("others").innerHTML = CATS.filter(x => x !== c).map(x =>
    `<button type="button" data-id="${x.id}" style="${style(x)}">${x.e} ${esc(x.name)}</button>`).join("");
  /* 卡片裡的第二個連結：點它時不要跟著開主連結 */
  document.querySelectorAll(".alt").forEach(el => el.addEventListener("click", ev => {
    ev.preventDefault(); ev.stopPropagation(); location.href = el.dataset.url;
  }));
}
$("others").addEventListener("click", e => {
  const b = e.target.closest("button"); if (b) location.hash = b.dataset.id;
});
$("backBtn").addEventListener("click", () => { location.hash = ""; });
$("heroBack").addEventListener("click", () => { location.hash = ""; });

function route(){
  const id = location.hash.replace("#", "");
  const c = CATS.find(x => x.id === id);
  $("viewHome").hidden = !!c;
  $("viewCat").hidden = !c;
  $("heroBack").hidden = !c;
  if (c){ renderCat(c); window.scrollTo({ top: 0 }); }
}
window.addEventListener("hashchange", route);
route();
</script>
</body>
</html>
